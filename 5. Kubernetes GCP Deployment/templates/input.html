<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle CO2 Emission Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        form {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 5px;
            background-color: #f9f9f9;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h2 style="text-align:center">Vehicle CO2 Emission Prediction</h2>
    <form action="/predict" method="post">
        <label for="engine size">Engine Size (L):</label>
        <input type="number" step="any" id="engine size" name="engine size" required>

        <label for="fuel consumption combined">Combined Fuel Consumption (L/100km):</label>
        <input type="number" step="any" id="fuel consumption combined" name="fuel consumption combined" required>

        <input type="submit" value="Predict">
    </form>
</body>
</html>
